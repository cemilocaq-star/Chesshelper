name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Stockfish-in ən son rəsmi release etiketini Android NDK ilə arm64 üçün yığır
      - name: Build Stockfish (arm64)
        run: |
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git
          cd Stockfish
          TAG=$(git tag --list 'sf_*' --sort=-v:refname | head -n1)
          if [ -n "$TAG" ]; then git checkout "$TAG"; fi
          echo "Stockfish: ${TAG:-default branch}"
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd src
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          test -f stockfish || { echo "stockfish binarisi yaranmadı"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # debug APK birbaşa quraşdırıla bilir (açar generasiyası lazım deyil)
      - name: Build APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-apk
          path: app/build/outputs/apk/debug/*.apk
