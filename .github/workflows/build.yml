name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Stockfish-i Android NDK ilə arm64 üçün yığır. Ən son 5 rəsmi release etiketi ardıcıl yoxlanılır:
      # birincisi yığılan istifadə olunur, uğursuz olanın xəta sətirləri log-da göstərilir.
      - name: Build Stockfish (arm64)
        run: |
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          aarch64-linux-android21-clang++ --version

          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git
          cd Stockfish
          built=""
          for TAG in $(git tag --list 'sf_*' --sort=-v:refname | head -n 5); do
            echo "::group::Stockfish $TAG"
            git checkout -q -f "$TAG"
            git clean -fdxq
            if (cd src && make -j"$(nproc)" build ARCH=armv8 COMP=ndk > ../build.log 2>&1); then
              built="$TAG"
              echo "::endgroup::"
              break
            fi
            echo "Build failed for $TAG. Last log lines:"
            tail -n 40 build.log
            cp build.log "$GITHUB_WORKSPACE/stockfish-build-$TAG.log" || true
            echo "::endgroup::"
          done
          if [ -z "$built" ]; then
            echo "::error::Stockfish could not be built for any of the latest tags"
            exit 1
          fi
          echo "Built Stockfish $built"
          test -f src/stockfish
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp src/stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - name: Upload Stockfish build logs (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-build-logs
          path: stockfish-build-*.log
          if-no-files-found: ignore

      # Gradle yüklənməsi müvəqqəti server xətalarında (504) təkrar cəhd edir
      - name: Install Gradle 8.7
        run: |
          curl -fL --retry 8 --retry-all-errors --retry-delay 5 \
            -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      # debug APK birbaşa quraşdırıla bilir (açar generasiyası lazım deyil)
      - name: Build APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-apk
          path: app/build/outputs/apk/debug/*.apk
