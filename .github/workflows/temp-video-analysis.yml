name: Temporary video frame extraction
on:
  push:
    branches:
      - temp/video-frame-analysis
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Extract metadata and frames
        run: |
          mkdir -p video-analysis/frames
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of json Screen_Recording_20261109_162522_Chess.mp4 > video-analysis/metadata.json
          ffmpeg -hide_banner -loglevel error -i Screen_Recording_20261109_162522_Chess.mp4 -vf "fps=1,scale=1280:-1" video-analysis/frames/frame-%04d.jpg
          zip -qr video-analysis-frames.zip video-analysis
      - uses: actions/upload-artifact@v4
        with:
          name: chess-video-frames
          path: video-analysis-frames.zip
          retention-days: 1
