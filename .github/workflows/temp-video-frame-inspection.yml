name: Temporary chess video frame inspection

on:
  push:
    branches:
      - temp/video-frame-analysis
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact commit containing the uploaded recording
        uses: actions/checkout@v4
        with:
          ref: 15b792313dc6fec473f96e6893a0f800f289a43a
          path: recording-source
      - name: Install frame tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Extract frames and metadata
        run: |
          set -euo pipefail
          VIDEO="recording-source/Screen_Recording_20261109_162522_Chess.mp4"
          test -s "$VIDEO"
          mkdir -p video-analysis/frames
          ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate,codec_name -of json "$VIDEO" > video-analysis/metadata.json
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          ffmpeg -hide_banner -loglevel error -i "$VIDEO" -vf "fps=1/3,scale=720:-1" -frames:v 24 video-analysis/frames/frame_%03d.jpg
          ffmpeg -hide_banner -loglevel error -i "$VIDEO" -vf "fps=1/3,scale=480:-1,tile=3x4:padding=8:margin=8" -frames:v 1 video-analysis/contact-sheet.jpg
          printf 'duration_seconds=%s\n' "$DURATION" > video-analysis/README.txt
          find video-analysis -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - name: Upload extracted frames only
        uses: actions/upload-artifact@v4
        with:
          name: chess-video-frames
          path: video-analysis/
          retention-days: 1
          if-no-files-found: error
